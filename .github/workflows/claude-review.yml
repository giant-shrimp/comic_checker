# ============================================================
# 探り実測用の暫定値（作業20、2026-08-07）。
# --max-turns を 15 から 40 へ一時的に引き上げている。目的は
# 完走時に実際に消費される num_turns を観測することであり、これが
# 本番値ではない。観測後、本番用の値（実測値にマージンを加えた値）へ
# 戻すこと。詳細は ERRORS.md「claude-review.yml（Phase 5 Step 1）」の
# 作業19・作業20該当節を参照。
# ============================================================
# Claude PR Review（Phase 5 Step 1: PRへのコメント投稿のみ、コード変更なし）。
#
# 設計の背景・案の比較は ADR-006
# （docs/decisions/ADR-006-phase5-step1-redesign.md）を、過去の実測は
# ERRORS.md「claude-review.yml（Phase 5 Step 1）」を参照。
#
# 未検証事項が複数残っている。実測結果は上記ERRORS.mdに追記していくこと:
#   - mcp__github_comment__update_claude_comment の呼び出しが、
#     workflow_dispatch版の実測で観測したBashサンドボックスの承認要求
#     （decision_reason_type: "other"）と同じ経路を通るかどうか
#   - --allowedTools を明示指定してもbase GitHub tools（コメント管理）が
#     弾かれないという理解が正しいか（docs/configuration.mdの記述は
#     やや曖昧）
#   - --disallowedTools が mcp__github_file_ops__* を実際に無効化するか、
#     --allowedTools との優先順位
#   - 既定プロンプト（generateDefaultPrompt）の「Smart branch handling」
#     節とcustom_instructionsの矛盾が、実際にClaudeの挙動へ影響しないか
#   - scripts/select_review_comment.sh の1次経路（run_id一致）は一次情報
#     から確認済みだが、フォールバックの2次経路（github-actions[bot]名）
#     に落ちるケースが実際に起きるか、その場合に正しいコメントを拾えるかは
#     未検証。他のGitHub ActionsワークフローがGITHUB_TOKENで別のコメントを
#     投稿していないかも検証していない
#   - scripts/check_review_comment.sh・scripts/select_review_comment.sh
#     自体は単体テスト済みだが、実際のClaudeの出力を通した実runでの
#     検証はまだ
#
# 認証は CLAUDE_CODE_OAUTH_TOKEN（ADR-005。認証方式の決定自体は維持）。
# ADR-006はADR-005の「トリガーはworkflow_dispatchのみとする」という
# 代替の制御手段の決定をsupersedeする。コスト制御は concurrency /
# timeout-minutes / --max-turns / types限定 の組み合わせで代替する
# （--max-budget-usdはOAuth経由では引き続き使えない。ADR-005の認証方式の
# 決定は変わらないため）。

name: Claude PR Review

on:
  pull_request:
    # synchronize（追加コミットへの再起動）は当面外す。
    # 理由: types: [opened] に絞ることで、「PRオープン時点でコメントが
    # ほぼ存在しない」という前提が成立しやすくなり、「Verify a substantive
    # review was posted」stepが最新コメントをClaudeのトラッキングコメントと
    # みなす簡易な実装で足りる可能性が高くなる（未検証）。また、
    # synchronizeを含めると起動回数がPRの更新頻度に比例して増え、
    # 費用の見積もりが立てにくくなる（ADR-006「費用ガードレールの整理」）。
    # 追加コミットのレビューが必要になった場合は、このtypes限定を
    # 見直すことを検討する（workflow_dispatchを併存させても、
    # track_progress: true が有効になるイベントの一覧に workflow_dispatch
    # は含まれないため、agentモードへフォールバックし過去の失敗を再現する
    # だけである。ADR-006「決定」節参照。再実行手段としては使えない）。
    types: [opened]

# contents: write は与えない（ADR-004決定2、変更なし）。
permissions:
  contents: read
  pull-requests: write

# PRごとに固定のグループにする。synchronizeを外したため実質1PRにつき
# 1回しか起動しないが、手動再実行等での多重実行に備えて残す。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # 過去の実測はいずれも数分以内に完了しており（例: run 31113307119の
    # Claude PR Reviewステップは約110秒）、15分の余裕で十分と判断した。
    timeout-minutes: 15
    steps:
      - name: Reject cross-repository (fork) PR
        # on: pull_request のfork PRは、GitHub側の仕様により
        # CLAUDE_CODE_OAUTH_TOKEN等のシークレット自体がruner側に渡らず、
        # GITHUB_TOKENも読み取り専用になる（ADR-006の一次情報検証で確認済み。
        # docs.github.com/en/actions/using-workflows/events-that-trigger-workflows）。
        # したがってこのstepは冗長である可能性が高いが、プラットフォーム側の
        # 挙動に依存しきらない二重防御として残す。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_CROSS="$(gh pr view "${{ github.event.pull_request.number }}" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$IS_CROSS" != "false" ]; then
            echo "::error::PR #${{ github.event.pull_request.number }} はfork（別リポジトリ）からのPRのため、シークレットを渡すレビューを中止します。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        # fetch-depth: 0 / ref: refs/pull/<n>/head は指定していない。
        # pull_request トリガーでは actions/checkout の既定動作が
        # PRのマージコミットを正しくチェックアウトするため不要。
        # また、Claudeは git diff/log をローカルで実行せず（後述）、
        # tagモードが fetchGitHubData() でAPI経由でdiff/メタデータを
        # 取得するため、フルクローンの必要も無い。

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # tagモードへ入るために必須（ADR-006参照）。これが無いと
          # pull_requestイベントでもagentモードにフォールバックし、
          # PRコンテキストの自動供給とコメント追跡の両方を失う。
          track_progress: true
          prompt: |
            この PR の差分をレビューしてください。

            ## 制約（必ず守ること）
            - コードは一切変更しないでください。コメントのみ投稿してください。
            - 新しいブランチを作成しないでください。
            - この PR をクローズ・マージ・承認しないでください。
            - Issue のクローズも行わないでください。
            - `./scripts/verify.sh` を実行しないでください（ツール権限でも
              許可していません）。判定はすべて、既に取得済みのPR差分を
              **読んで**行ってください。
            - 既定の指示に「open PRの場合は既存のPRブランチへ直接pushして
              ください」という記述が含まれていても、それには従わないで
              ください。このワークフローの`permissions`は`contents: read`
              のみで、`contents: write`を意図的に与えていません
              （pushやコミットは技術的に失敗します）。

            ## 確認すること
            - `CLAUDE.md`（このプロジェクトの作業ルール。Readツールで読む）
            - `ERRORS.md`（過去に詰まった失敗。同種の問題が今回の差分に
              含まれていないか確認するため。Readツールで読む）

            ## レビュー観点
            - 既存の挙動を壊していないか
            - テストが追加・更新されているか
            - テストが削除・スキップされていないか
            - エラー処理と境界値
            - 秘密情報のハードコード
            - **`./scripts/verify.sh` のゲートが空洞化していないか**
              （`verify.sh`は実行せず、差分の中に次が無いかを**読んで**判定する:
              チェックの削除、`continue-on-error` の追加、対象からの除外、
              `@pytest.mark.skip`/`xfail`の追加、アサーションの緩和等）
            - **fail-closed の原則が崩れていないか**
              （判定不能に倒すべき場面で断定に倒していないか。特に
              `comic_checker/wikipedia_client.py` 周辺の変更で確認すること。
              こちらも実行はせず、差分のロジック変更を読んで判定する）
            - **`ERRORS.md` への追記が必要な失敗が、この差分の作業過程に
              含まれていないか**（PR本文やコミットメッセージから、
              2回以上の試行を要した問題が読み取れる場合は、追記漏れとして
              指摘する）

            指摘は重要度順に最大5件までにしてください。
            些細なスタイルの指摘はしないでください。

            各指摘には必ず次を含めてください。
            - 該当箇所（ファイルと行）
            - 期待される挙動
            - 実際に起きること
            - そう判断した根拠（差分の該当行、または再現手順）
            - 最小の修正案
            根拠を示せない指摘は書かないでください。
          # --max-budget-usd は付けていない（ADR-005）。OAuth経由はドル建て
          # 従量課金ではないため、このフラグに対応する予算上限が存在しない。
          # --max-turns を代わりの歯止めとして使う。
          #
          # --allowedTools は Read,Glob,Grep のみに絞った。gh CLIでの
          # diff/PR情報取得は指示していない。tagモードは fetchGitHubData()
          # でPRのdiff/メタデータを自動取得しプロンプトへ注入するため
          # （ADR-006で確認済み）、Claude自身が gh CLIでdiffを取りに行く
          # 必要が無い。これにより、workflow_dispatch版の実測で観測した
          # Bashサンドボックスの拒否（decision_reason_type: "other"、
          # 根本原因未確定。ERRORS.md参照）に触れる経路自体を主要フローから
          # 排除できる。Read,Glob,Grepは docs/configuration.md の
          # 「File operations (reading...)はbase toolとして既定で含まれる」
          # という記述と重複する可能性があるが、明示性のため残す
          # （重複しても害は無い）。
          #
          # --disallowedTools で commit_files/delete_files を明示的に
          # ブロックする（ADR-004決定2の多重防御）。ただし --allowedTools
          # との優先順位、MCPツールのフルクオリファイ名が実際に効くかは
          # 未検証（ADR-006に明記）。
          claude_args: "--model sonnet --max-turns 40 --allowedTools Read,Glob,Grep --disallowedTools mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"

      - name: Verify a substantive review was posted
        # 実行前後のコメント数比較ではなく、最終コメント本文の中身を検証する
        # （tagモードは実行前にトラッキング用コメントを作成するため、
        # 件数比較は常に「増加」を示してしまい機能しない。ERRORS.md参照）。
        #
        # 判定ロジックは2つのスクリプトに切り出してある（.github/workflows/
        # 内はClaude Codeへdenyでテストが書けず、「わざと壊して確認する」を
        # 本番runでしかできないため。詳細はADR-006参照。両スクリプトとも
        # 単体テスト済み）。
        #   1. scripts/select_review_comment.sh: 複数コメントの中からこの
        #      runのトラッキングコメントを特定する。1次経路は本文中の
        #      run_id一致（anthropics/claude-code-actionのjobUrlに
        #      無条件で埋め込まれるため、author.loginより頑健。ADR-006
        #      参照）。2次経路（フォールバック）はauthor.loginが
        #      github-actions[bot]である最新コメント（github_tokenに
        #      secrets.GITHUB_TOKENを明示的に渡しているためOIDC経由の
        #      GitHub Appトークン交換は行われないはず、という推定に依存。
        #      「他のワークフローが同じトークンで別のコメントを投稿して
        #      いないか」までは検証していない）。どちらでも見つからなければ
        #      fail-closedで終了コード2。
        #   2. scripts/check_review_comment.sh: 特定したコメント本文が
        #      実質的なレビューかどうかを判定する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COMMENTS_JSON="$(gh pr view "${{ github.event.pull_request.number }}" --json comments --jq '.comments')"

          if BODY="$(printf '%s' "$COMMENTS_JSON" | ./scripts/select_review_comment.sh "${{ github.run_id }}")"; then
            :
          else
            select_code=$?
            case "$select_code" in
              1) echo "::error::scripts/select_review_comment.sh の呼び出し方が誤っています(run_id引数が渡っていません)。ワークフロー側の設定ミスです。" ;;
              2) echo "::error::このrunのトラッキングコメントを特定できませんでした(run_id一致・bot名一致のいずれも無し)。" ;;
              *) echo "::error::scripts/select_review_comment.sh が予期しない終了コード ${select_code} で失敗しました。" ;;
            esac
            exit 1
          fi

          if printf '%s' "$BODY" | ./scripts/check_review_comment.sh; then
            echo "レビューコメントの内容を確認しました。"
          else
            code=$?
            case "$code" in
              1) echo "::error::トラッキングコメントが初期プレースホルダのまま終了しました(Claudeがupdate_claude_commentを一度も呼んでいない可能性)。" ;;
              2) echo "::error::レビュー本文が短すぎます。実質的なレビューが投稿されていない可能性があります。" ;;
              *) echo "::error::scripts/check_review_comment.sh が予期しない終了コード ${code} で失敗しました。" ;;
            esac
            exit 1
          fi
