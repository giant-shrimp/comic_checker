# v8計画 5-2（PR自動レビュー）相当だが、5-6 の Step 1（コメントするだけ、
# コード変更なし）に厳密に限定してある。ADR-004 決定2の前提（contents: write
# を与えない）を守るため、permissions に contents: write は含めていない。
# 含めた場合、mainのサーバサイド保護が無い状態（403で確認済み）でActionsが
# 書き込み権限を持つことになり、決定2が崩れる。
#
# 認証は CLAUDE_CODE_OAUTH_TOKEN（ADR-005。ADR-004決定1をsupersede）。
# サブスク枠を消費する経路のため --max-budget-usd は使えない。トリガーを
# workflow_dispatch のみに絞り、--max-turns で歯止めをかけている（詳細は
# ADR-005「代替の制御手段」）。ADR-004決定2・決定3はこのADR-005と独立に
# 有効なまま。
#
# workflow_dispatch のみで起動する。pr_number 入力を必須にしてある。
# cron等での常時稼働は、この構成（金銭上限が掛けられない）では想定しない。
# 実行のたびに対話セッション側の枠への影響を人間が観測すること（ADR-005）。

name: Claude PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "レビュー対象のPR番号（必須）"
        required: true
        type: number

# contents: write は与えない（ADR-004 決定2）。
# コメント投稿にのみ必要な pull-requests: write と、チェックアウトに要る
# contents: read だけを与える。
permissions:
  contents: read
  pull-requests: write

# 連続手動実行でレビューが積み上がらないようにする。トリガーが
# workflow_dispatch のみになったため、キーは inputs.pr_number だけでよい。
concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # 旧if:（github.event_name == 'workflow_dispatch' || github.event.pull_request...）は
    # 削除した。workflow_dispatchイベントにはgithub.event.pull_requestが存在せず
    # 常にfalseになるため、この条件は恒真式（常にtrue）になっており機能を
    # 失っていた（pull_requestトリガー時代の名残）。
    #
    # ただし「forkのPRをpr_numberで指定できてしまう」リスクは条件式の話とは別に
    # 残っていたため、それは下のstep（Reject cross-repository PR）で
    # コード側に落とした。運用者の確認任せにはしていない。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject cross-repository (fork) PR
        # このstepは actions/checkout より前にあるため、作業ディレクトリに
        # まだgitリポジトリが無い。gh pr view はカレントのgitリモートから
        # 対象リポジトリを推定するため、その推定が効かない。GH_REPO で
        # 対象リポジトリを明示することで、この状態でも動くようにする。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_CROSS="$(gh pr view "${{ inputs.pr_number }}" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$IS_CROSS" != "false" ]; then
            echo "::error::PR #${{ inputs.pr_number }} はfork（別リポジトリ）からのPRのため、シークレットを渡すレビューを中止します。"
            exit 1
          fi

      - name: Count comments before review
        # work_loop.sh の no-op 検出（Issue #16）と同じ考え方。「Actionが成功と
        # 報告すること」と「実際にレビューコメントが投稿されること」は別の事象
        # だと判明した（run 31111080310で実測: is_error:false・num_turns:9で
        # 正常終了したにもかかわらず、コメント0件だった）。実行前後のコメント数を
        # 比較し、増えていなければ後段のstepで落とす。
        id: comments_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COUNT="$(gh pr view "${{ inputs.pr_number }}" --json comments --jq '.comments | length')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_dispatch は pr_number からPRのHEADを明示的に取得する。
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        env:
          # --allowedTools の Bash(gh pr diff:*) / Bash(gh pr view:*) を
          # 認証させるため。checkout の persist-credentials は git 用であり、
          # Claudeが呼ぶ gh コマンドには別途GH_TOKENが要る（fork判定stepと同じ理由）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # show_full_output: true は診断用の一時設定（初回実測でerror_max_turns・
          # permission_denials_count 8を観測したが、既定のshow_full_output: false
          # では拒否された内容がログに出ず原因を特定できなかったため）。
          # 権限拒否の内訳を観測したら、原因特定後に外すか維持するかを判断する。
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            この PR の差分をレビューしてください。

            ## 制約（必ず守ること）
            - コードは一切変更しないでください。コメントのみ投稿してください。
            - 新しいブランチを作成しないでください。
            - この PR をクローズ・マージ・承認しないでください。
            - Issue のクローズも行わないでください。
            - `./scripts/verify.sh` を実行しないでください（ツール権限でも
              許可していません）。判定はすべて `gh pr diff` で取得した差分を
              **読んで**行ってください。

            ## Bashコマンドの制約（必ず守ること）
            - Bashコマンドを `;` `&&` `|` `>` で連結しないでください。
              1回のBash呼び出しにつき1コマンドだけ実行してください。
            - ファイルへのリダイレクト（`>`等）はせず、コマンドの出力を
              そのまま読んでください。
            - 許可されているコマンドは `gh pr diff` と `gh pr view` だけです。
              `wc`・`cat`・`echo`等、他のコマンドは使えません。
            - コマンドが拒否された場合、**人間に承認を求めず**、単一コマンドに
              分割して再試行してください。**このワークフローは非対話実行であり、
              承認する人間はその場にいません。** 「承認いただければ続行します」
              のような応答で終了しないでください。

            ## 事前に取得・確認するもの
            - `gh pr diff ${{ inputs.pr_number }}` でこのPRの差分を取得する
            - `gh pr view ${{ inputs.pr_number }}` でPR本文・コミット情報を確認する
            - `CLAUDE.md`（このプロジェクトの作業ルール。Readツールで読む）
            - `ERRORS.md`（過去に詰まった失敗。同種の問題が今回の差分に
              含まれていないか確認するため。Readツールで読む）

            ## レビュー観点
            - 既存の挙動を壊していないか
            - テストが追加・更新されているか
            - テストが削除・スキップされていないか
            - エラー処理と境界値
            - 秘密情報のハードコード
            - **`./scripts/verify.sh` のゲートが空洞化していないか**
              （`verify.sh`は実行せず、差分の中に次が無いかを**読んで**判定する:
              チェックの削除、`continue-on-error` の追加、対象からの除外、
              `@pytest.mark.skip`/`xfail`の追加、アサーションの緩和等）
            - **fail-closed の原則が崩れていないか**
              （判定不能に倒すべき場面で断定に倒していないか。特に
              `comic_checker/wikipedia_client.py` 周辺の変更で確認すること。
              こちらも実行はせず、差分のロジック変更を読んで判定する）
            - **`ERRORS.md` への追記が必要な失敗が、この差分の作業過程に
              含まれていないか**（`gh pr view`で取得できるPR本文やコミット
              メッセージから、2回以上の試行を要した問題が読み取れる場合は、
              追記漏れとして指摘する）

            指摘は重要度順に最大5件までにしてください。
            些細なスタイルの指摘はしないでください。

            各指摘には必ず次を含めてください。
            - 該当箇所（ファイルと行）
            - 期待される挙動
            - 実際に起きること
            - そう判断した根拠（差分の該当行、または再現手順）
            - 最小の修正案
            根拠を示せない指摘は書かないでください。
          # --max-budget-usd は付けていない（ADR-005）。CLAUDE_CODE_OAUTH_TOKEN は
          # サブスク枠を消費する経路であり、ドル建ての従量課金ではないため
          # このフラグに対応する予算上限が存在しない。--max-turns を代わりの
          # 歯止めとして使う。
          #
          # --allowedTools は読み取り系のみ（Edit/Writeは含めない。Step 1は
          # コメントのみのため、ADR-004決定2とも整合する）。claude-code-action は
          # Bashを既定で許可しないため（公式ドキュメントで確認済み）、明示的に
          # 許可しないと差分取得・PR情報取得ができずBash呼び出しが拒否され続ける
          # （初回実測 run 31094393958 のerror_max_turns・permission_denials_count 8
          # の主因と推定）。
          #   - Read, Glob, Grep: CLAUDE.md/ERRORS.md等の読み取り
          #   - Bash(gh pr diff:*): このPRの差分取得
          #   - Bash(gh pr view:*): PR本文・コミット情報の取得
          # git diff / git log は意図的に含めていない。actions/checkout は
          # 指定した ref（refs/pull/<n>/head）のみをチェックアウトするため、
          # origin/main が名前解決できる保証がない（verify.yml で同じ問題に
          # 対処済み。「Ensure origin/main exists」step参照）。gh pr diff / gh pr view
          # はGitHub側のAPIから直接取得するためこの問題を回避できる。
          claude_args: "--model sonnet --max-turns 15 --allowedTools Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Verify a review comment was posted
        # 「Count comments before review」で控えた件数と比較する。増えていなければ
        # Actionの終了コードに関わらずこのstepをfail-closedで落とす。
        # verify.shの「わざと壊してexit 1を確認する」対象にもなる
        # （このifの条件を反転させれば、常に検出しない壊れ方を再現できる）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BEFORE="${{ steps.comments_before.outputs.count }}"
          AFTER="$(gh pr view "${{ inputs.pr_number }}" --json comments --jq '.comments | length')"
          if [ "$AFTER" -le "$BEFORE" ]; then
            echo "::error::Actionは成功したがレビューコメントが投稿されていません（実行前 ${BEFORE} 件 → 実行後 ${AFTER} 件）。"
            exit 1
          fi
          echo "レビューコメントが投稿されたことを確認しました（${BEFORE} 件 → ${AFTER} 件）。"
